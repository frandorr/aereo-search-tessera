[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aer-search-tessera-workspace"
version = "1.0.0"
description = "aer plugin for GeoTessera satellite embeddings search"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aer", "plugin", "embeddings", "geotessera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "AER Team" }]
dependencies = [
    "aer-eo",
    "geopandas>=1.1.2,<2.0.0",
    "pandera[geopandas]>=0.24.0,<0.25.0",
    "pyarrow>=15.0.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
]

[project.entry-points."aer.plugins"]
search_tessera = "aer.search_tessera.core:TesseraSearchPlugin"

[project.urls]
Homepage = "https://github.com/frandorr/aer-search-tessera"
Repository = "https://github.com/frandorr/aer-search-tessera"
Issues = "https://github.com/frandorr/aer-search-tessera/issues"
Documentation = "https://frandorr.github.io/aer-search-tessera"

[tool.uv]
managed = true
add-bounds = "major"

[tool.uv.sources]
aer-eo = { path = "../aer/projects/aer-core", editable = true }

[tool.uv.workspace]
members = ["projects/*"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    ".venv",
    "./development/*.py",
]
line-length = 120

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["components/", "bases/"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["components/", "bases/"]

[dependency-groups]
dev = [
    "odc-geo>=0.5.1,<0.6.0",
    "polylith-cli>=1.43.0,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "python-semantic-release>=10.5.3,<11.0.0",
]

[tool.pytest]
ini_options.markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
[tool.coverage]
run.branch = true
run.source = [ "components" ]
run.omit = [
  "*/test*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/site/*",
  "*/dist/*",
  "*/build/*",
  "*/development/*",
]
report.show_missing = true
report.skip_covered = false
report.fail_under = 0
report.exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
html.directory = "htmlcov"
