[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "aer-search-tessera"
version = "1.0.0"
description = "Polylith project for the search-tessera plugin"
readme = "README.md"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aer", "plugin", "embeddings", "geotessera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "AER Team" }]

requires-python = ">=3.12"

dependencies = [
    "aer-eo",
    "geopandas>=1.1.2,<2.0.0",
    "pandera[geopandas]>=0.24.0,<0.25.0",
    "pyarrow>=15.0.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/frandorr/aer-search-tessera"
Repository = "https://github.com/frandorr/aer-search-tessera"
Issues = "https://github.com/frandorr/aer-search-tessera/issues"
Documentation = "https://frandorr.github.io/aer-search-tessera"

[project.entry-points."aer.plugins"]
search_tessera = "aer.search_tessera.core:TesseraSearchPlugin"

[tool.hatch]
build.dev-mode-dirs = ["../../components", "../../bases", "../../development", "."]
build.hooks.polylith-bricks = {}
build.targets.wheel.packages = ["aer"]

[tool.polylith]
bricks."../../components/aer/search_tessera" = "aer/search_tessera"
